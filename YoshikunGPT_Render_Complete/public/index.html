<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="/manifest.webmanifest">
<title>よしくんGPT</title>
<style>
:root{--bg:#080b19;--panel:#11172d;--panel2:#18213d;--line:#2b3b67;--text:#f8fbff;--muted:#99a8ca;--a:#22d3ee;--b:#8b5cf6;--c:#ec4899;--ok:#4ade80;--bad:#fb7185}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text);background:radial-gradient(circle at 10% 0,#162858 0,transparent 34%),radial-gradient(circle at 100% 0,#401a65 0,transparent 34%),var(--bg);overflow:hidden}
button,textarea,select,input{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top)}header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #ffffff18;background:#080b19d9;backdrop-filter:blur(16px)}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b),var(--c));font-size:23px}.brand{min-width:0}.brand b{display:block;font-size:17px}.brand small{color:var(--muted)}.status{margin-left:auto;font-size:12px;color:var(--ok);white-space:nowrap}.menu{border:1px solid var(--line);background:var(--panel2);color:white;border-radius:11px;padding:9px 11px}
.layout{min-height:0;display:grid;grid-template-columns:285px 1fr}.side{padding:14px;overflow:auto;border-right:1px solid #ffffff14;background:#0c1125d9}.card{padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#18213de8,#10162ce8)}label{display:block;margin-bottom:7px;font-size:12px;color:var(--muted)}select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;color:white;background:#0b1228}.toggle{display:flex;align-items:center;justify-content:space-between}.toggle input{width:auto}.small{font-size:12px;color:var(--muted);line-height:1.55}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{border:1px solid var(--line);border-radius:10px;padding:9px;background:#18213d;color:white}
.main{min-width:0;min-height:0;display:grid;grid-template-rows:1fr auto}.chat{min-height:0;overflow:auto;padding:22px clamp(12px,4vw,42px)}.hero{max-width:670px;margin:6vh auto 25px;text-align:center;padding:28px 18px;border:1px solid #ffffff1b;border-radius:23px;background:#11172db8}.orb{width:78px;height:78px;margin:auto;display:grid;place-items:center;border-radius:25px;background:linear-gradient(135deg,var(--a),var(--b),var(--c));font-size:39px;box-shadow:0 0 45px #8b5cf655}.hero p{color:var(--muted);line-height:1.7}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}.chip{border:1px solid var(--line);border-radius:99px;padding:8px 11px;background:#17203b;color:#e7efff}
.msg{max-width:860px;margin:14px auto;display:flex;gap:9px}.msg.user{flex-direction:row-reverse}.avatar{flex:0 0 36px;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b))}.user .avatar{background:linear-gradient(135deg,#f472b6,#fb923c)}.bubble{max-width:min(78%,720px);padding:12px 14px;border:1px solid var(--line);border-radius:17px;background:#17203bea;line-height:1.65;white-space:pre-wrap;word-break:break-word}.user .bubble{background:linear-gradient(135deg,#5b21b6e8,#3346a8e8)}.meta{margin-top:6px;font-size:10px;color:var(--muted)}.sources{margin-top:11px;padding-top:9px;border-top:1px solid #ffffff1c}.sources a{display:block;color:#9eeaff;font-size:12px;line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.typing span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--a);animation:p 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes p{50%{opacity:.2;transform:translateY(-3px)}}
.composer-wrap{padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#080b19e8}.composer{max-width:950px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px;border:1px solid #41578e;border-radius:17px;background:#11172df2}.composer textarea{resize:none;min-height:44px;max-height:150px;border:0;outline:0;padding:10px;background:transparent;color:white}.send{min-width:76px;border:0;border-radius:12px;color:white;font-weight:700;background:linear-gradient(135deg,var(--b),#4f6cff)}.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);opacity:0;padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:#11172d;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){.layout{grid-template-columns:1fr}.side{position:fixed;z-index:10;top:63px;bottom:0;left:0;width:min(300px,88vw);transform:translateX(-105%);transition:.22s}.side.open{transform:translateX(0)}.brand small{display:none}.chat{padding:12px 9px}.hero{margin:2vh auto 16px;padding:19px 12px}.bubble{max-width:calc(100% - 45px);font-size:14px}.composer-wrap{padding-left:6px;padding-right:6px}.send{min-width:58px}}
</style>
</head>
<body>
<div class="app">
<header><button class="menu" id="menu">☰</button><div class="logo">⚡</div><div class="brand"><b>よしくんGPT</b><small>Render・Web検索対応 完成版</small></div><div class="status" id="status">接続確認中</div></header>
<div class="layout">
<aside class="side" id="side">
<div class="card"><label>AI人格</label><select id="persona"><option value="friendly">フレンドリー</option><option value="cheeky">生意気ヨシ君</option><option value="teacher">先生</option><option value="gamer">ゲーマー</option><option value="gentle">やさしい</option></select></div>
<div class="card toggle"><div><b>🌐 Web検索</b><div class="small">最新情報を必要時に検索</div></div><input id="web" type="checkbox" checked></div>
<div class="card toggle"><div><b>🧠 履歴保存</b><div class="small">この端末へ保存</div></div><input id="memory" type="checkbox" checked></div>
<div class="card"><label>API接続先</label><input id="endpoint" placeholder="空欄＝同一ドメイン /api/chat"><div class="small">GitHub Pagesから別のRender APIを使う場合だけ、Render URLを入力します。</div></div>
<div class="card"><div class="actions"><button id="health">接続確認</button><button id="export">履歴保存</button><button id="clear">履歴削除</button><button id="install">アプリ追加</button></div></div>
<div class="card small">Renderでは環境変数 <b>OPENAI_API_KEY</b> を設定してください。APIキーをこのHTMLへ書かないでください。</div>
</aside>
<main class="main"><section class="chat" id="chat"><div class="hero" id="hero"><div class="orb">🤖</div><h2>準備完了！</h2><p>普通の会話は自然に、最新情報が必要な質問ではWeb検索を使って答えます。</p><div class="chips"><button class="chip">できることを教えて</button><button class="chip">今日のニュースを検索して</button><button class="chip">面白い話をして</button><button class="chip">Renderの設定方法</button></div></div></section><div class="composer-wrap"><div class="composer"><textarea id="input" rows="1" placeholder="メッセージを入力…"></textarea><button class="send" id="send">送信</button></div></div></main>
</div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),chat=$('#chat'),input=$('#input');const state={history:[],busy:false,deferred:null};
const settings=()=>({persona:$('#persona').value,web:$('#web').checked,memory:$('#memory').checked,endpoint:$('#endpoint').value.trim()});
function save(){const s=settings();localStorage.setItem('yoshi_settings',JSON.stringify(s));if(s.memory)localStorage.setItem('yoshi_history',JSON.stringify(state.history.slice(-80)));else localStorage.removeItem('yoshi_history')}
function restore(){try{const s=JSON.parse(localStorage.getItem('yoshi_settings')||'{}');$('#persona').value=s.persona||'friendly';$('#web').checked=s.web!==false;$('#memory').checked=s.memory!==false;$('#endpoint').value=s.endpoint||'';state.history=JSON.parse(localStorage.getItem('yoshi_history')||'[]');state.history.forEach(x=>add(x.role,x.content,x.sources,false,x.time))}catch{}}
function api(path){const base=$('#endpoint').value.trim().replace(/\/$/,'');return base?(base.endsWith('/api/chat')?base:base+path):path}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('show'),2300)}
function add(role,content,sources=[],store=true,time=Date.now()){document.querySelector('#hero')?.remove();const w=document.createElement('article');w.className='msg '+role;const a=document.createElement('div');a.className='avatar';a.textContent=role==='user'?'👤':'🤖';const b=document.createElement('div');b.className='bubble';const t=document.createElement('div');t.textContent=content;b.append(t);if(sources?.length){const s=document.createElement('div');s.className='sources';sources.slice(0,7).forEach(x=>{const l=document.createElement('a');l.href=x.url;l.target='_blank';l.rel='noopener noreferrer';l.textContent='↗ '+(x.title||x.url);s.append(l)});b.append(s)}const m=document.createElement('div');m.className='meta';m.textContent=(role==='user'?'YOU':'YOSHIKUN GPT')+' • '+new Date(time).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});b.append(m);w.append(a,b);chat.append(w);chat.scrollTop=chat.scrollHeight;if(store){state.history.push({role,content,sources,time});save()}}
function typing(){const w=document.createElement('article');w.className='msg';w.id='typing';w.innerHTML='<div class="avatar">🤖</div><div class="bubble typing"><span></span><span></span><span></span></div>';chat.append(w);chat.scrollTop=chat.scrollHeight}
async function send(){const text=input.value.trim();if(!text||state.busy)return;state.busy=true;$('#send').disabled=true;add('user',text);input.value='';resize();typing();try{const r=await fetch(api('/api/chat'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:state.history.slice(-12,-1),persona:$('#persona').value,webEnabled:$('#web').checked})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`APIエラー (${r.status})`);$('#typing')?.remove();add('assistant',data.answer,data.sources||[])}catch(e){$('#typing')?.remove();add('assistant','接続できませんでした。\n\n'+e.message+'\n\nRenderの環境変数 OPENAI_API_KEY とデプロイログを確認してください。',[]);toast('API接続エラー')}finally{state.busy=false;$('#send').disabled=false;input.focus()}}
async function health(){try{const url=api('/api/health').replace(/\/api\/chat$/,'/api/health');const r=await fetch(url);const d=await r.json();$('#status').textContent=d.configured?'AI接続OK':'APIキー未設定';$('#status').style.color=d.configured?'var(--ok)':'var(--bad)';toast(d.configured?'OpenAI接続設定済み':'OPENAI_API_KEYが未設定')}catch{$('#status').textContent='接続失敗';$('#status').style.color='var(--bad)';toast('Renderへ接続できません')}}
function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'}
$('#send').onclick=send;input.oninput=resize;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#menu').onclick=()=>$('#side').classList.toggle('open');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{input.value=b.textContent;send()});['persona','web','memory','endpoint'].forEach(id=>$('#'+id).onchange=save);$('#health').onclick=health;$('#clear').onclick=()=>{if(confirm('会話履歴を削除しますか？')){state.history=[];localStorage.removeItem('yoshi_history');chat.innerHTML='';add('assistant','履歴を削除しました。',[],false)}};$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(state.history,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yoshikungpt-history.json';a.click();URL.revokeObjectURL(a.href)};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();state.deferred=e});$('#install').onclick=async()=>{if(!state.deferred)return toast('Safariでは共有メニューから「ホーム画面に追加」を選んでください');state.deferred.prompt();await state.deferred.userChoice;state.deferred=null};restore();health();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
})();
</script></body></html>
