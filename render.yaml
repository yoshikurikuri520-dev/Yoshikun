services:
  - type: web
    name: yoshikungpt
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: RATE_LIMIT_PER_MINUTE
        value: 30
      - key: ALLOWED_ORIGINS
        value: same-origin
